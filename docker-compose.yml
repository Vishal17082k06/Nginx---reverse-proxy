services:
  backend1:
    build: ./backend
    container_name: backend1
    environment:
      - INSTANCE_ID=Instance-1
    expose:
      - "8000"
    networks:
      - app_network

  backend2:
    build: ./backend
    container_name: backend2
    environment:
      - INSTANCE_ID=Instance-2
    expose:
      - "8000"
    networks:
      - app_network

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend1
      - backend2
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
